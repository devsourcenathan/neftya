services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: neftya
      POSTGRES_PASSWORD: neftya
      POSTGRES_DB: neftya
    ports:
      - '5432:5432'
    volumes:
      - neftya-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neftya']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neftya-postgres:
